<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Repartidor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style> body { background-color: #f1f5f9; font-family: 'Segoe UI', sans-serif; } </style>
</head>
<!-- pt-20 asegura que el contenido no quede tapado por la barra superior fija -->
<body class="pt-20 pb-6">

  <!-- LOGIN (Fondo blanco, sin textos duplicados) -->
  <div id="loginScreen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 overflow-y-auto">
    <div class="w-full flex flex-col items-center max-w-sm">
      <img src="logo.png" onerror="this.src='logo.jpeg'" alt="Logo" class="w-48 h-auto mb-8 object-contain">
      <div class="w-full space-y-4 mb-8">
        <input type="text" id="userInput" placeholder="Usuario" class="w-full text-center text-xl p-4 rounded-xl border-2 border-slate-200 focus:border-blue-600 focus:outline-none" autocapitalize="none">
        <input type="password" id="passInput" placeholder="Contraseña" class="w-full text-center text-xl p-4 rounded-xl border-2 border-slate-200 focus:border-blue-600 focus:outline-none">
      </div>
      <button onclick="ingresarAlSistema(this)" class="bg-blue-800 hover:bg-blue-900 text-white w-full py-4 rounded-xl font-bold text-lg shadow-xl transition">ENTRAR</button>
    </div>
    <p class="absolute bottom-6 text-[10px] text-slate-400 font-bold uppercase tracking-widest text-center">Desarrollado Por Fernando Rodriguez 2026</p>
  </div>

  <!-- BARRA SUPERIOR FIJA ESTILO TOTAL NOTE -->
  <header class="bg-blue-800 text-white p-4 shadow-lg hidden flex justify-between items-center fixed top-0 w-full z-40" id="appHeader">
    <div class="flex items-center gap-4">
      <button onclick="toggleMenu()" class="text-2xl focus:outline-none active:scale-95 transition"><i class="fa-solid fa-bars"></i></button>
      <h2 class="text-lg font-bold truncate" id="tituloApp">Nuevo Envío</h2>
    </div>
    <div class="text-right flex flex-col items-end">
      <p class="text-[10px] text-blue-200 uppercase font-bold leading-none">Agente Activo</p>
      <p class="text-sm font-bold truncate max-w-[120px]" id="userName">Chofer</p>
    </div>
  </header>

  <!-- MENÚ LATERAL DESPLEGABLE (DRAWER) -->
  <div id="sideMenu" class="fixed inset-y-0 left-0 w-64 bg-white transform -translate-x-full transition-transform duration-300 z-50 shadow-2xl flex flex-col">
    <div class="p-6 bg-slate-50 border-b flex justify-center"><img src="logo.png" onerror="this.src='logo.jpeg'" alt="Logo" class="h-12 object-contain"></div>
    <nav class="flex-1 p-4 space-y-2 font-bold text-slate-700">
      <button onclick="cambiarVista('vistaNuevo', 'Nuevo Envío')" class="w-full text-left p-4 rounded-xl bg-blue-50 text-blue-700 navBtn"><i class="fa-solid fa-box-open w-6"></i> Recibir Paquete</button>
      <button onclick="cambiarVista('vistaEntregas', 'Confirmar Entrega')" class="w-full text-left p-4 rounded-xl hover:bg-slate-100 navBtn"><i class="fa-solid fa-house-circle-check w-6"></i> Entregar</button>
      <button onclick="cambiarVista('vistaHistorial', 'Historial')" class="w-full text-left p-4 rounded-xl hover:bg-slate-100 navBtn"><i class="fa-solid fa-list w-6"></i> Historial</button>
      <button id="btnNavFinanzas" onclick="cambiarVista('vistaFinanzas', 'Finanzas')" class="w-full text-left p-4 rounded-xl hover:bg-slate-100 navBtn hidden"><i class="fa-solid fa-chart-line w-6"></i> Balance General</button>
    </nav>
    <div class="p-4 border-t"><button onclick="location.reload()" class="w-full text-left p-4 rounded-xl text-red-500 hover:bg-red-50 font-bold"><i class="fa-solid fa-power-off w-6"></i> Cerrar Sesión</button></div>
  </div>
  <!-- Fondo negro semi-transparente del menú -->
  <div id="menuOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden z-40"></div>

  <!-- VISTA 1: NUEVO ENVÍO -->
  <main id="vistaNuevo" class="px-4 hidden">
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <form onsubmit="guardarEnvioMovil(event)" class="space-y-4">
        <p class="font-bold text-xs text-slate-400 uppercase tracking-wide">Datos del Remitente</p>
        <input type="text" id="m_ciRem" onblur="buscarM('Rem')" placeholder="CI/RUC Remitente" class="w-full border-b-2 border-slate-200 p-2 font-bold text-blue-800 bg-slate-50 focus:outline-none" required>
        <input type="text" id="m_nomRem" placeholder="Nombre Remitente" class="w-full border-b border-slate-200 p-2 focus:outline-none" required>
        <input type="text" id="m_telRem" placeholder="Teléfono" class="w-full border-b border-slate-200 p-2 focus:outline-none" required>
        
        <p class="font-bold text-xs text-slate-400 uppercase tracking-wide mt-6">Datos del Destinatario</p>
        <input type="text" id="m_ciDest" onblur="buscarM('Dest')" placeholder="CI/RUC Destino" class="w-full border-b-2 border-slate-200 p-2 font-bold text-blue-800 bg-slate-50 focus:outline-none" required>
        <input type="text" id="m_nomDest" placeholder="Nombre Destinatario" class="w-full border-b border-slate-200 p-2 focus:outline-none" required>
        <input type="text" id="m_telDest" placeholder="Teléfono" class="w-full border-b border-slate-200 p-2 focus:outline-none">
        <input type="text" id="m_dirDest" placeholder="Dirección Destino" class="w-full border-b border-slate-200 p-2 focus:outline-none">
        
        <p class="font-bold text-xs text-slate-400 uppercase tracking-wide mt-6">Detalles y Cobro</p>
        <input type="text" id="m_detalle" placeholder="¿Qué contiene el paquete?" class="w-full border-b border-slate-200 p-2 font-bold text-slate-700 focus:outline-none" required>
        <input type="number" id="m_costo" placeholder="Costo del Envío (Gs.)" class="w-full border-b-2 border-emerald-400 p-3 font-bold text-emerald-700 text-lg mt-2 focus:outline-none" required>
        <select id="m_tipoCli" class="w-full border-2 border-slate-200 p-3 rounded-xl font-bold text-slate-700 mt-2"><option value="Contado">PAGO AL CONTADO</option><option value="Corporativo">CUENTA CORPORATIVA</option></select>
        
        <div class="border-2 border-dashed border-slate-300 bg-slate-50 p-4 text-center rounded-xl mt-4" onclick="document.getElementById('cameraRecepcion').click()">
          <p class="font-bold text-slate-500 text-sm"><i class="fa-solid fa-camera mb-1 text-2xl text-blue-400"></i><br>Agregar Foto (Opcional)</p>
          <input type="file" id="cameraRecepcion" accept="image/*" capture="environment" class="hidden" onchange="leerFoto(event, 'previewRecepcion', 2)">
        </div>
        <img id="previewRecepcion" class="mt-2 rounded-xl hidden w-full h-40 object-cover border shadow-sm">
        
        <button type="submit" id="btnRegMovil" class="w-full bg-blue-800 text-white font-bold py-4 rounded-xl shadow-lg mt-6 text-lg tracking-wide active:scale-95 transition">GUARDAR EN BASE</button>
      </form>
    </div>
  </main>

  <!-- VISTA 2: ENTREGAS -->
  <main id="vistaEntregas" class="px-4 hidden">
    <div class="bg-white rounded-2xl shadow-sm p-5 mb-4">
      <h3 class="font-bold text-slate-400 text-xs uppercase tracking-wide mb-4 text-center">Escanear o Escribir Código</h3>
      <input type="text" id="idEnvio" placeholder="Ej: LT-123456" class="w-full border-b-4 border-blue-600 p-4 text-2xl text-center font-bold mb-6 uppercase text-blue-900 bg-slate-50 focus:outline-none rounded-t-xl">
      <div class="border-2 border-dashed bg-blue-50 border-blue-300 p-8 text-center rounded-xl active:bg-blue-100 transition" onclick="document.getElementById('cameraEntrega').click()">
        <p class="font-bold text-blue-800 text-lg"><i class="fa-solid fa-camera mb-2 text-5xl"></i><br>Capturar Firma / Foto Destino</p>
        <input type="file" id="cameraEntrega" accept="image/*" capture="environment" class="hidden" onchange="leerFoto(event, 'previewEntrega', 1)">
      </div>
      <img id="previewEntrega" class="mt-4 rounded-xl hidden w-full h-48 object-cover border border-blue-200 shadow-md">
      <button onclick="subirFoto(this)" class="w-full bg-emerald-500 text-white font-bold py-5 rounded-xl shadow-lg mt-6 text-lg uppercase tracking-wide active:scale-95 transition">Registrar Entrega</button>
    </div>
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <h3 class="font-bold text-slate-400 text-xs uppercase tracking-wide mb-3 text-center">Ticketera Bluetooth</h3>
      <div class="grid grid-cols-2 gap-3"><button onclick="imprimirTicket(1)" class="bg-slate-800 text-white py-4 rounded-xl font-bold shadow active:scale-95 transition"><i class="fa-solid fa-receipt mr-1"></i> Cliente</button><button onclick="imprimirTicket(2)" class="bg-blue-800 text-white py-4 rounded-xl font-bold shadow active:scale-95 transition"><i class="fa-solid fa-copy mr-1"></i> Empresa</button></div>
    </div>
  </main>

  <!-- VISTA 3: HISTORIAL (Tarjetas ultra compactas con teléfonos) -->
  <main id="vistaHistorial" class="px-4 hidden">
    <div class="flex gap-2 mb-4 sticky top-20 z-10 bg-slate-100 p-2 rounded-xl shadow-sm border border-slate-200">
      <input type="text" id="m_inputBusqueda" oninput="filtrarHistorialMovil()" placeholder="Buscar CI/Nombre..." class="w-1/2 border p-2 rounded-lg text-sm focus:outline-none">
      <select id="m_filtroTiempo" onchange="filtrarHistorialMovil()" class="w-1/4 border p-2 rounded-lg text-xs font-bold text-slate-700 bg-white focus:outline-none"><option value="todos">Últimos</option><option value="hoy">Hoy</option></select>
      <button onclick="cargarHistorialMovil()" class="w-1/4 bg-blue-800 text-white rounded-lg text-sm shadow active:scale-95 transition"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
    <div id="m_resultados" class="space-y-3 pb-8"></div>
  </main>

  <!-- VISTA 4: FINANZAS -->
  <main id="vistaFinanzas" class="px-4 hidden">
    <div class="grid grid-cols-1 gap-4">
      <div class="bg-gradient-to-r from-emerald-500 to-emerald-700 text-white p-6 rounded-2xl shadow-lg"><p class="text-sm font-bold opacity-80 uppercase tracking-widest mb-1"><i class="fa-solid fa-money-bill-wave"></i> Ingresos del Mes</p><p class="text-4xl font-black tracking-tighter">Gs. <span id="mGanancia">0</span></p></div>
      <div class="bg-gradient-to-r from-amber-500 to-amber-600 text-white p-6 rounded-2xl shadow-lg"><p class="text-sm font-bold opacity-80 uppercase tracking-widest mb-1"><i class="fa-solid fa-truck-ramp-box"></i> Paquetes en Tránsito</p><p class="text-4xl font-black tracking-tighter" id="mPendientes">0</p></div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyAwM6OAW5u_jLp2y2iCdJZtK3P7yUONt2UEFIuVTRYNIrwQGMD03_uJyGpzJnxcKkYmQ/exec";
    let usuarioActual = ""; let fotoEntregaData = ""; let fotoRecepcionData = ""; let historialGlobalM = [];

    // --- MENÚ HAMBURGUESA ---
    function toggleMenu() {
      const menu = document.getElementById('sideMenu'); const overlay = document.getElementById('menuOverlay');
      if (menu.classList.contains('-translate-x-full')) { menu.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); } 
      else { menu.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
    }

    async function apiRequest(payload) {
      try { let res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) }); return await res.json(); } 
      catch (e) { return { success: false, error: "Error de red: " + e.message }; }
    }
    
    async function ingresarAlSistema(btn) {
      const user = document.getElementById('userInput').value; const pass = document.getElementById('passInput').value;
      if(!user || !pass) return; btn.innerHTML = "CARGANDO..."; btn.disabled = true;
      const res = await apiRequest({ accion: 'login', usuario: user, password: pass });
      btn.innerHTML = "ENTRAR"; btn.disabled = false;
      if(res.success) {
        document.getElementById('loginScreen').style.display = 'none'; 
        document.getElementById('appHeader').classList.remove('hidden'); 
        document.getElementById('appHeader').classList.add('flex'); // Se asegura que use flex
        document.getElementById('userName').innerText = res.nombre; usuarioActual = res.nombre;
        if(res.rol === 'Dueño') { document.getElementById('btnNavFinanzas').classList.remove('hidden'); cargarDashboardMovil(); }
        cambiarVista('vistaNuevo', 'Nuevo Envío');
      } else { alert("Aviso: " + res.error); }
    }

    function cambiarVista(vista, titulo) {
      ['vistaEntregas','vistaNuevo','vistaHistorial','vistaFinanzas'].forEach(v => document.getElementById(v).classList.add('hidden'));
      document.getElementById(vista).classList.remove('hidden');
      document.getElementById('tituloApp').innerText = titulo;
      
      // Actualiza estilos de botones del menú
      document.querySelectorAll('.navBtn').forEach(b => { b.classList.remove('bg-blue-50', 'text-blue-700'); b.classList.add('hover:bg-slate-100'); });
      event.currentTarget.classList.add('bg-blue-50', 'text-blue-700'); event.currentTarget.classList.remove('hover:bg-slate-100');
      
      toggleMenu(); // Cierra el menú automáticamente
      if(vista === 'vistaHistorial' && historialGlobalM.length === 0) cargarHistorialMovil();
    }

    async function cargarDashboardMovil() { const res = await apiRequest({ accion: 'getDashboard' }); if(res.success) { document.getElementById('mPendientes').innerText = res.pendientes; document.getElementById('mGanancia').innerText = res.gananciaMes.toLocaleString('es-PY'); } }
    
    function leerFoto(e, imgId, tipoVar) { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = ev => { document.getElementById(imgId).src = ev.target.result; document.getElementById(imgId).classList.remove('hidden'); if(tipoVar === 1) fotoEntregaData = ev.target.result; if(tipoVar === 2) fotoRecepcionData = ev.target.result; }; reader.readAsDataURL(file); }

    async function subirFoto(btn) {
      const id = document.getElementById('idEnvio').value.toUpperCase(); if(!id || !fotoEntregaData) return alert("Falta código o foto");
      btn.innerHTML = "Subiendo..."; btn.disabled = true;
      const res = await apiRequest({ accion: 'confirmarEntrega', idEnvio: id, foto: fotoEntregaData });
      btn.innerHTML = "Confirmar Entrega"; btn.disabled = false;
      if(res.success) { alert("¡Entregado!"); document.getElementById('idEnvio').value=''; document.getElementById('previewEntrega').classList.add('hidden'); fotoEntregaData=""; historialGlobalM=[]; } else alert(res.error);
    }

    async function buscarM(tipo) {
      const ci = document.getElementById('m_ci' + tipo).value; if(!ci) return; document.getElementById('m_ci' + tipo).classList.add('bg-yellow-100');
      const res = await apiRequest({ accion: 'buscarCliente', ci: ci }); document.getElementById('m_ci' + tipo).classList.remove('bg-yellow-100');
      if(res.encontrado) { document.getElementById('m_nom' + tipo).value = res.nombre; document.getElementById('m_tel' + tipo).value = res.telefono; if(tipo === 'Dest') { document.getElementById('m_dirDest').value = res.direccion; document.getElementById('m_tipoCli').value = res.tipo; } }
    }

    async function guardarEnvioMovil(e) {
      e.preventDefault(); document.getElementById('btnRegMovil').innerHTML = "CARGANDO...";
      const datos = { ciRem: document.getElementById('m_ciRem').value, nomRem: document.getElementById('m_nomRem').value, telRem: document.getElementById('m_telRem').value, ciDest: document.getElementById('m_ciDest').value, nomDest: document.getElementById('m_nomDest').value, telDest: document.getElementById('m_telDest').value, dirDest: document.getElementById('m_dirDest').value, detalle: document.getElementById('m_detalle').value, costo: document.getElementById('m_costo').value, tipoCli: document.getElementById('m_tipoCli').value };
      const res = await apiRequest({ accion: 'guardarEnvio', datos: datos, agente: usuarioActual, fotoRecepcion: fotoRecepcionData });
      document.getElementById('btnRegMovil').innerHTML = "GUARDAR ENVÍO";
      if(res.success) { alert("CREADO: " + res.id); e.target.reset(); document.getElementById('previewRecepcion').classList.add('hidden'); fotoRecepcionData = ""; historialGlobalM = []; document.getElementById('idEnvio').value = res.id; cambiarVista('vistaEntregas', 'Confirmar Entrega'); }
    }

    function extraerIdDrive(url) {
      if(!url) return null; let m1 = url.match(/id=([^&]+)/); if (m1) return m1[1]; let m2 = url.match(/\/d\/([a-zA-Z0-9_-]+)/); if (m2) return m2[1]; return null;
    }

    function generarMiniatura(url) {
      let id = extraerIdDrive(url);
      if(!id) return `<div class="w-12 h-12 bg-slate-100 border rounded flex items-center justify-center text-[8px] text-slate-400 font-bold">Sin foto</div>`;
      let imgUrl = `https://drive.google.com/thumbnail?id=${id}&sz=w150`; let dlUrl = `https://drive.google.com/uc?export=download&id=${id}`;
      return `<a href="${dlUrl}" target="_blank"><img src="${imgUrl}" class="w-12 h-12 object-cover rounded border border-slate-300 shadow-sm" onerror="this.src='https://via.placeholder.com/40?text=IMG';"></a>`;
    }

    function parsearFechaPY(fechaStr) { if(!fechaStr) return new Date(0); let p = fechaStr.split(',')[0].trim().split('/'); return (p.length === 3) ? new Date(p[2], p[1] - 1, p[0]) : new Date(fechaStr); }

    async function cargarHistorialMovil() {
      document.getElementById('m_resultados').innerHTML = "<p class='text-blue-800 font-bold text-center mt-10'><i class='fa-solid fa-spinner fa-spin text-2xl'></i><br>Cargando...</p>";
      const res = await apiRequest({ accion: 'getHistorial' });
      if(res.success) { historialGlobalM = res.resultados; filtrarHistorialMovil(); }
    }

    function filtrarHistorialMovil() {
      const busq = document.getElementById('m_inputBusqueda').value.toLowerCase().trim(); const filtroT = document.getElementById('m_filtroTiempo').value; const div = document.getElementById('m_resultados'); let hoy = new Date(); hoy.setHours(0,0,0,0);
      let filtrados = historialGlobalM.filter(r => {
        let matchText = true; if(busq) { let cRem = r.ciRem.toString().toLowerCase(); let cDest = r.ciDest.toString().toLowerCase(); let nr = r.nombreRem.toLowerCase(); let nd = r.nombreDest.toLowerCase(); matchText = (r.id.toLowerCase().includes(busq) || cRem.includes(busq) || cRem.split('-')[0].includes(busq) || cDest.includes(busq) || nr.includes(busq) || nd.includes(busq)); }
        let matchTime = true; let fEnvio = parsearFechaPY(r.fecha); fEnvio.setHours(0,0,0,0);
        if (filtroT === 'hoy') matchTime = fEnvio.getTime() === hoy.getTime(); else if (filtroT === 'semana') { let diffDias = Math.floor((hoy - fEnvio) / (1000 * 60 * 60 * 24)); matchTime = diffDias <= 7 && diffDias >= 0; } else if (filtroT === 'mes') matchTime = fEnvio.getMonth() === hoy.getMonth() && fEnvio.getFullYear() === hoy.getFullYear();
        return matchText && matchTime;
      });

      div.innerHTML = "";
      if(filtrados.length > 0) {
        filtrados.forEach(r => {
          div.innerHTML += `
            <div class="bg-white rounded-xl p-3 shadow-sm border-l-4 ${r.estado==='Entregado'?'border-green-500':'border-amber-500'}">
              <div class="flex justify-between items-start border-b border-slate-100 pb-2 mb-2">
                <div><p class="font-black text-blue-900 leading-none">${r.id}</p><p class="text-[9px] text-slate-400 font-bold mt-1">${r.fecha}</p></div>
                <div class="text-right"><span class="text-[10px] font-bold ${r.estado==='Entregado'?'text-green-600 bg-green-50':'text-amber-600 bg-amber-50'} px-2 py-1 rounded-md uppercase tracking-wider">${r.estado}</span><p class="text-xs font-bold text-emerald-600 mt-1">Gs. ${Number(r.costo||0).toLocaleString('es-PY')}</p></div>
              </div>
              <div class="grid grid-cols-4 gap-2 mb-2">
                <div class="col-span-3 space-y-2">
                  <div><p class="text-[9px] text-slate-400 uppercase font-black tracking-widest leading-none">Remite</p><p class="text-xs font-bold text-slate-700 truncate leading-tight">${r.nombreRem}</p><p class="text-[10px] text-slate-500">${r.ciRem} | <i class="fa-solid fa-phone"></i> ${r.telRem}</p></div>
                  <div><p class="text-[9px] text-slate-400 uppercase font-black tracking-widest leading-none">Destino</p><p class="text-xs font-bold text-slate-700 truncate leading-tight">${r.nombreDest}</p><p class="text-[10px] text-slate-500">${r.ciDest} | <i class="fa-solid fa-phone"></i> ${r.telDest}</p></div>
                </div>
                <div class="col-span-1 flex flex-col gap-1 items-end justify-center">${generarMiniatura(r.fotoRecepcion)}${generarMiniatura(r.fotoEntrega)}</div>
              </div>
            </div>`;
        });
      } else { div.innerHTML = "<p class='text-sm text-slate-400 text-center mt-8 font-bold'>No hay resultados.</p>"; }
    }

    async function imprimirTicket(tipo) {
      try {
        const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] }); const server = await device.gatt.connect(); const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb'); const char = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
        let texto = "--------------------------------\n        LUIS TRANSPORTES\n--------------------------------\nCOMPROBANTE DE ENVIO\nFecha: " + new Date().toLocaleDateString() + "\n"; if(tipo === 2) texto += "\n\nCOPIA EMPRESA\nFIRMA: _______________________\nACLARACION:\n"; texto += "\n\n\n\n";
        await char.writeValue(new TextEncoder().encode(texto)); alert("Imprimiendo...");
      } catch(e) { alert("Error Bluetooth."); }
    }
  </script>
</body>
</html>
